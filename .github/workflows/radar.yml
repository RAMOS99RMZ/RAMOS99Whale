name: whale-radar-v2
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
concurrency: { group: radar, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore DB
        run: git fetch origin data-store:data-store 2>/dev/null && git show data-store:radar.db > data/radar.db 2>/dev/null; git show data-store:model.joblib > data/model.joblib 2>/dev/null || true
      - name: Run radar (8 samples x 60s)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar.main
      - name: Persist DB to data-store branch
        run: |
          cp data/radar.db /tmp/; cp data/model.joblib /tmp/ 2>/dev/null || true
          git config user.name radar-bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tmp-store && git rm -rf . -q
          cp /tmp/radar.db .; cp /tmp/model.joblib . 2>/dev/null || true
          git add radar.db model.joblib 2>/dev/null; git add radar.db
          git commit -qm "db $(date -u +%FT%TZ)" && git push -f origin tmp-store:data-store
      - name: Keep alive (trigger next run)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run radar.yml --ref ${{ github.event.repository.default_branch }} || true
