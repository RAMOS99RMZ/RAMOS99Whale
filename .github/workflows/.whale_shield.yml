name: Whale Shield AI Tracker 2026

on:
  schedule:
    - cron: '*/15 * * * *' # تشغيل كل 15 دقيقة
  workflow_dispatch: # إمكانية التشغيل اليدوي بنقرة زر

permissions:
  contents: write # السماح للـ Workflow بحفظ ملف التعلم الذاتي

jobs:
  run-whale-shield:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Whale Shield AI Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and Push Model Self-Learning Memory
        run: |
          git config --global user.name "WhaleShield-Bot"
          git config --global user.email "bot@github.com"
          git add model_state.json || true
          git commit -m "🧠 [AI Auto-Learning] تحديث أوزان النموذج بناءً على نتائج الدورة" || true
          git push || true
